environment: local
server:
  http_port: 8080
  management_port: 9090
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 20s
  max_header_bytes: 1048576
  max_body_bytes: 2097152
logging:
  level: info
  format: text
mysql:
  dsn: root:mysql_12345@tcp(127.0.0.1:13306)/go_main?charset=utf8mb4&parseTime=true&loc=UTC
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m
redis:
  address: 127.0.0.1:16379
  password: redis_12345
  database: 0
  dial_timeout: 3s
  read_timeout: 2s
  write_timeout: 2s
identity:
  access_token_ttl: 2h
  refresh_token_ttl: 168h
  captcha_ttl: 5m
file_storage:
  type: local
  root: .tmp/uploads
  public_base_url: ""
  max_file_bytes: 2097152
  s3:
    endpoint: ""
    region: us-east-1
    bucket: ""
    access_key: ""
    secret_key: ""
    use_path_style: true
  aliyun_oss:
    endpoint: ""
    bucket: ""
    access_key: ""
    secret_key: ""
rocketmq:
  endpoints: 127.0.0.1:18081
  topic_prefix: go-service-main-local
  consumer_group: go-service-main-api-local
  await_duration: 5s
  topics: [events]
  concurrency: 8
  max_body_bytes: 1048576
