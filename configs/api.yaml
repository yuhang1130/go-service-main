environment: local
server:
  http_port: 8080
  management_port: 9090
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 20s
  max_header_bytes: 1048576
  max_body_bytes: 2097152
logging:
  level: info
  format: text
resilience:
  http_rate_limit:
    enabled: true
    requests_per_second: 100
    burst: 200
    client_ttl: 10m
mysql:
  dsn: ""
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m
redis:
  address: ""
  password: ""
  database: 0
  dial_timeout: 3s
  read_timeout: 2s
  write_timeout: 2s
identity:
  access_token_ttl: 2h
  refresh_token_ttl: 168h
  captcha_ttl: 5m
  login_rate_limit: 10
  login_rate_window: 1m
file_storage:
  type: local
  root: .tmp/uploads
  public_base_url: ""
  max_file_bytes: 2097152
  s3:
    endpoint: ""
    region: us-east-1
    bucket: ""
    access_key: ""
    secret_key: ""
    use_path_style: true
  aliyun_oss:
    endpoint: ""
    bucket: ""
    access_key: ""
    secret_key: ""
