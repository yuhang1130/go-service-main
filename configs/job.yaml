environment: local
server:
  management_port: 9091
  read_header_timeout: 5s
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 30s
  max_header_bytes: 1048576
  max_body_bytes: 1048576
logging:
  level: info
  format: text
resilience:
  circuit_breaker:
    failure_threshold: 5
    open_timeout: 30s
    half_open_max_requests: 1
mysql:
  dsn: ""
  max_open_conns: 15
  max_idle_conns: 5
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m
rocketmq:
  endpoints: 127.0.0.1:18081
  topic_prefix: go-service-main-local
  topics: [events]
  max_body_bytes: 1048576
