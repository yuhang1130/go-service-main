environment: local
server:
  management_port: 9092
  read_header_timeout: 5s
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 30s
  max_header_bytes: 1048576
  max_body_bytes: 1048576
logging:
  level: info
  format: text
mysql:
  dsn: ""
  max_open_conns: 15
  max_idle_conns: 5
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m
redis:
  address: ""
  password: ""
  database: 0
  dial_timeout: 3s
  read_timeout: 10s
  write_timeout: 2s
task_dispatch:
  stream_prefix: go-service-main
  stream: material:collection:v1
  consumer_group: go-service-main-material-collection-v1
  consumer_name: ""
  read_block: 5s
  handler_timeout: 2h
  reclaim_interval: 30s
  claim_min_idle: 1m
  concurrency: 2
  max_message_bytes: 4096
